<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Dance Battle</title>
<style>
body{font-family:sans-serif; background:#f5f5f5; padding:20px; text-align:center}
.card{background:white; padding:15px; border-radius:15px; margin:10px auto; max-width:400px; display:flex; justify-content:space-between; font-weight:bold; box-shadow:0 2px 10px #0001}
button{background:#6c5ce7; color:white; border:none; padding:16px 30px; border-radius:30px; font-size:18px; margin-top:20px; cursor:pointer}
</style>
</head>
<body>
<h1>💃 Urban Dance Battle</h1>
<p id="spotsText">15 Spots Left</p>

<div class="card"><span>🏆 1st Place</span><span>$5,000 + Trophy</span></div>
<div class="card"><span>🥈 2nd Place</span><span>$3,000 + Medal</span></div>
<div class="card"><span>🥉 3rd Place</span><span>$2,000 + Medal</span></div>

<button id="joinBtn" onclick="doRegister()">Join Now - Register</button>

<p style="margin-top:30px; color:gray; font-size:12px;">
<a href="#" onclick="localStorage.clear(); location.reload();">Reset Test</a></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC2tCVCvpt4VAfk9nd27GLAOK0hbah0LVo",
  authDomain: "competition-backend-10783.firebaseapp.com",
  projectId: "competition-backend-10783",
  storageBucket: "competition-backend-10783.firebasestorage.app",
  messagingSenderId: "765940891583",
  appId: "1:765940891583:web:081e1a488a2eddd0406b0a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.doRegister = async function(){
  const btn = document.getElementById('joinBtn');
  btn.innerText = "Saving...";
  try{
    await addDoc(collection(db, "registrations"), { 
      event: "Urban Dance Battle", 
      time: new Date().toLocaleString()
    });
    alert('✅ HO GAYA! Firebase me save ho gaya!');
    btn.innerText = 'Registered!';
    btn.disabled = true;
  }catch(e){ 
    alert("Error: " + e.message); 
    btn.innerText = "Try Again";
  }
}
</script>
</body>
</html>
