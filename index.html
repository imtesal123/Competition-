<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Dance Battle</title>
<style>body{font-family:Arial;max-width:400px;margin:auto;padding:15px;background:#eef}
.card{background:#c5c9ff;padding:20px;border-radius:15px}
.box{background:#fff;padding:12px;border-radius:10px;margin-top:10px}
.btn{background:#000;color:#fff;padding:15px;width:100%;border:none;border-radius:10px;font-size:16px;margin-top:15px}</style>
</head><body>
<div class="card">
<h2>Urban Dance Battle 2025</h2>
<p>📍 Los Angeles - Prize $10,000</p>
<div class="box"><b id="spots">Only 19 spots left</b></div>
</div>
<button id="btn" class="btn" onclick="reg()">Join Now - Register</button>
<p style="text-align:center">Created by Imtes - 2026</p>
<script>
let s=localStorage.getItem('s')?+localStorage.getItem('s'):19;
let r=localStorage.getItem('r')=='1';
function ui(){document.getElementById('spots').innerText='Only '+s+' spots left';
if(r||s<=0){document.getElementById('btn').innerText=r?'Already Registered ✓':'Closed';document.getElementById('btn').disabled=true}}
function reg(){if(!r&&s>0){s--;r=true;localStorage.setItem('s',s);localStorage.setItem('r','1');alert('Registered! Left: '+s);ui()}}ui();
</script>
</body></html>
